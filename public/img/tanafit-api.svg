<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" font-family="Tahoma, Verdana, sans-serif" font-size="13" text-anchor="middle">
    <title>Architecture de Tanafit API</title>
    <defs>
        <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 z" fill="#215dc6"/>
        </marker>
    </defs>

    <rect width="560" height="240" fill="#fff"/>

    <rect x="10" y="40" width="130" height="50" rx="4" fill="#fff" stroke="#215dc6" stroke-width="1.5"/>
    <text x="75" y="70">Front Vue</text>

    <rect x="10" y="140" width="130" height="50" rx="4" fill="#fff" stroke="#215dc6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="75" y="162">Appli Expo</text>
    <text x="75" y="180" font-size="11" fill="#808080">(plus tard)</text>

    <rect x="190" y="15" width="360" height="200" rx="6" fill="#eef3fc" stroke="#7f9db9" stroke-dasharray="6 4"/>
    <text x="200" y="35" text-anchor="start" font-size="12" font-weight="bold" fill="#215dc6">Docker Compose</text>

    <rect x="210" y="80" width="150" height="70" rx="4" fill="#d6dff7" stroke="#215dc6" stroke-width="1.5"/>
    <text x="285" y="108" font-weight="bold">API REST</text>
    <text x="285" y="128">Django 5.2 + DRF</text>

    <rect x="400" y="80" width="130" height="70" rx="4" fill="#fff" stroke="#215dc6" stroke-width="1.5"/>
    <text x="465" y="120">PostgreSQL 17</text>

    <line x1="140" y1="65" x2="208" y2="102" stroke="#215dc6" stroke-width="1.5" marker-end="url(#fleche)"/>
    <line x1="140" y1="165" x2="208" y2="128" stroke="#215dc6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fleche)"/>
    <text x="165" y="119" font-size="11" fill="#808080">JSON</text>
    <line x1="360" y1="115" x2="398" y2="115" stroke="#215dc6" stroke-width="1.5" marker-end="url(#fleche)"/>
</svg>
